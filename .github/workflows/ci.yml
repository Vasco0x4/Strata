name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Ruff
        run: uvx ruff@0.17.0 check .
      - name: Tests
        run: |
          uv venv
          uv pip install -e . pytest
          uv run pytest -q
